# PR Check - 仅验证 PR 可构建，不发布
# 完整构建和发布由 ci.yml 处理

name: PR Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/pr-check.yml"
  push:
    # release 走 dev→main 直推 FF merge（非 PR），补 push 触发让 fmt/clippy/test
    # 三门在集成到 main/dev 时也跑——CI 成为权威（消除本地 rustfmt 与 stable 的 skew）
    branches: [main, dev]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/pr-check.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # sqlx::query! 宏离线校验（查询缓存 .sqlx/ 已入库；改 SQL 后本地跑 cargo sqlx prepare 更新）
  SQLX_OFFLINE: "true"

jobs:
  # 快速验证: 仅 Linux 构建 + 测试
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install deps
        run: sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build -p xujing-jh-server -p xujing-jh-agent

      - name: Test
        run: cargo nextest run --workspace
        env:
          CARGO_TERM_COLOR: always
