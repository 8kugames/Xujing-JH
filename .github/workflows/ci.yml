# Xujing-JH CI/CD
# 流程: quality + build (并行) -> docker-build -> release (tag only)
# 触发: PR合并 | v* tag | 手动触发

name: CI

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # sqlx::query! 宏离线校验（查询缓存 .sqlx/ 已入库；改 SQL 后本地跑 cargo sqlx prepare 更新）
  SQLX_OFFLINE: "true"

jobs:
  # ==========================================================================
  # Job 1: 质量门 (fmt / clippy / test)
  # 与 build 并行；任一失败阻断 docker-build 与 release——发布不允许带病
  # ==========================================================================
  quality:
    name: Quality Gate
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install deps
        run: sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

  # ==========================================================================
  # Job 2: 跨平台构建 (4 targets)
  # Linux x86_64/arm64 (musl): cargo-zigbuild 交叉编译
  # macOS arm64: 原生构建
  # Windows x86_64: 原生构建
  # ==========================================================================
  build:
    name: Build ${{ matrix.platform }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 过渡发行：同时上传旧名（artifact_*）与新名（artifact_*_new）资产。
        # 旧 agent 仍按 cyber-jianghu-agent-* 自更新；新 agent 使用 xujing-jh-agent-*。
        # 下一个发行周期删除旧名副本（artifact_*）后即可收敛。
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            use_zigbuild: true
            artifact_server: cyber-jianghu-server-linux-x86_64
            artifact_client: cyber-jianghu-agent-linux-x86_64
            artifact_server_new: xujing-jh-server-linux-x86_64
            artifact_client_new: xujing-jh-agent-linux-x86_64
            bin_server: xujing-jh-server
            bin_client: xujing-jh-agent
          - os: ubuntu-latest
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
            use_zigbuild: true
            artifact_server: cyber-jianghu-server-linux-arm64
            artifact_client: cyber-jianghu-agent-linux-arm64
            artifact_server_new: xujing-jh-server-linux-arm64
            artifact_client_new: xujing-jh-agent-linux-arm64
            bin_server: xujing-jh-server
            bin_client: xujing-jh-agent
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            artifact_server: cyber-jianghu-server-macos-arm64
            artifact_client: cyber-jianghu-agent-macos-arm64
            artifact_server_new: xujing-jh-server-macos-arm64
            artifact_client_new: xujing-jh-agent-macos-arm64
            bin_server: xujing-jh-server
            bin_client: xujing-jh-agent
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            artifact_server: cyber-jianghu-server-windows-x86_64.exe
            artifact_client: cyber-jianghu-agent-windows-x86_64.exe
            artifact_server_new: xujing-jh-server-windows-x86_64.exe
            artifact_client_new: xujing-jh-agent-windows-x86_64.exe
            bin_server: xujing-jh-server.exe
            bin_client: xujing-jh-agent.exe

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install zigbuild deps (Linux musl)
        if: matrix.use_zigbuild
        run: sudo apt-get install -y libpq-dev pkg-config

      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.use_zigbuild
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@v2
        if: matrix.use_zigbuild
        with:
          tool: cargo-zigbuild

      - name: Install native deps (Linux glibc)
        if: runner.os == 'Linux' && !matrix.use_zigbuild
        run: sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl libpq

      - name: Build (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }} -p xujing-jh-server -p xujing-jh-agent

      - name: Build (native)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target ${{ matrix.target }} -p xujing-jh-server -p xujing-jh-agent

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.bin_server }} artifacts/${{ matrix.artifact_server }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_client }} artifacts/${{ matrix.artifact_client }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_server }} artifacts/${{ matrix.artifact_server_new }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin_client }} artifacts/${{ matrix.artifact_client_new }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_server }}
          path: artifacts/${{ matrix.artifact_server }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_client }}
          path: artifacts/${{ matrix.artifact_client }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_server_new }}
          path: artifacts/${{ matrix.artifact_server_new }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_client_new }}
          path: artifacts/${{ matrix.artifact_client_new }}

      - name: Summary
        run: |
          echo "## ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
          grep "^version" crates/*/Cargo.toml >> $GITHUB_STEP_SUMMARY || true

  # ==========================================================================
  # Job 3: Docker 镜像
  # ==========================================================================
  docker-build:
    name: Docker Image
    needs: [build, quality]
    if: |
      always() && needs.build.result == 'success' && needs.quality.result == 'success' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./crates/server/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # cache-to 已移除：GHA cache (type=gha) 在 tag 触发的发布构建上导出报 not_found
          # （v0.1.290 连续两次失败，build/push 本身成功，仅 cache 导出 cancel 了 push；
          # 根因是 GHA cache scope/写入问题，drop mode=max 治标不治本）。
          # 仅保留 cache-from 只读加速；如需恢复缓存写入，改用 type=registry
          # （ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:buildcache）。
          cache-from: type=gha

      - name: Summary
        run: |
          echo "## Docker 镜像" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 4: GitHub Release (tag only)
  # ==========================================================================
  release:
    name: GitHub Release
    needs: [build, quality, docker-build]
    if: always() && needs.build.result == 'success' && needs.quality.result == 'success' && needs.docker-build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "## Release: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
