[package]
name = "cyber-jianghu-protocol"
version = "0.1.112"
edition = "2024"
authors = ["Xujing-JH Community"]
license = "Apache-2.0"
description = "Shared protocol types for Xujing-JH MMO-MAS"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
sha2 = "0.10.9"

# 可选的 sqlx 支持 (用于服务端)
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros"], optional = true }

[features]
default = []
sqlx-support = ["sqlx"]

[dev-dependencies]
serde_json = "1.0.151"
