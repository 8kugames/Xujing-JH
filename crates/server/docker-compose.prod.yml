# ============================================================================
# Cyber-Jianghu Server Docker Compose (Production)
# 服务端生产环境配置 - 使用预构建镜像
# ============================================================================
#
# 部署步骤：
#
# 1. 首次部署（在服务器上）
#    git clone https://github.com/8kugames/Xujing-JH.git
#    cd Xujing-JH/crates/server
#    cp .env.example .env
#    # 编辑 .env，修改 DB_PASSWORD 等敏感配置
#
# 2. 如果镜像仓库是私有的，先登录 GHCR：
#    echo "YOUR_GITHUB_TOKEN" | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
#
# 3. 启动服务
#    docker compose -f docker-compose.prod.yml up -d
#
# 4. 查看日志
#    docker compose -f docker-compose.prod.yml logs -f
#
# 5. 更新镜像
#    docker compose -f docker-compose.prod.yml pull
#    docker compose -f docker-compose.prod.yml up -d
#
# 注意：
# - 数据库端口不对外暴露， 仅容器内部访问
# ============================================================================

services:
  # ============================================================================
  # PostgreSQL 数据库
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cyber-jianghu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: cyber_jianghu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 生产环境不暴露数据库端口
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyber-jianghu-network

  # ============================================================================
  # Rust 服务端
  # ============================================================================
  server:
    # 运行 tag：ship-server-binary.sh 用 Dockerfile.runtime 注入二进制并打同名
    # tag（compose build 源码全量构建也打同一 tag，后建者覆盖）
    image: cyber-jianghu-server:binary-runtime
    build:
      context: ../..
      dockerfile: ./crates/server/Dockerfile
    container_name: cyber-jianghu-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:-changeme}@postgres:5432/cyber_jianghu
      - RUST_LOG=${RUST_LOG:-info}
      - SERVER_PORT=23333
      - TICK_DURATION_SECS=${TICK_DURATION_SECS:-60}
      - ADMIN_READ_TOKEN=${ADMIN_READ_TOKEN:-}
      - ADMIN_WRITE_TOKEN=${ADMIN_WRITE_TOKEN:-}
      # 游戏客户端只读鉴权 token（可选，未配置时回退 ADMIN_READ_TOKEN）
      - CLIENT_READ_TOKEN=${CLIENT_READ_TOKEN:-}
      - ENVIRONMENT=production
      # 训练导出总开关（yaml 默认 false，生产环境显式开启；env 优先级高于 config/training_export.yaml）
      - TRAINING_EXPORT_ENABLED=true
    ports:
      - "${SERVER_PORT:-23333}:23333"
    volumes:
      # 配置文件挂载（数据驱动架构）
      # 如果 ./config 目录为空，entrypoint 会自动填充默认配置
      - ./config:/app/config
      # 日志持久化
      - ./logs:/app/logs
      # 运行时数据持久化（运行时产物如 prompt_templates.json）
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:23333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cyber-jianghu-network

# ============================================================================
# 网络配置
# ============================================================================
networks:
  cyber-jianghu-network:
    external: true

# ============================================================================
# 数据卷配置
# ============================================================================
volumes:
  postgres_data:
    name: cyber-jianghu-postgres-data
