[package]
name = "xujing-jh-embedding"
version = "0.1.4"
edition = "2024"
authors = ["Xujing-JH Community"]
license = "Apache-2.0"
description = "Embedding service for Xujing-JH MMO-MAS - local BERT inference + HTTP API"

[lib]
name = "cyber_jianghu_embedding"
path = "src/lib.rs"

[[bin]]
name = "cyber-jianghu-embedding"
path = "src/bin/embedding-service.rs"

[dependencies]
# 异步运行时
tokio = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
anyhow = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP 服务器
axum = { version = "0.8.9", features = ["tokio"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors"] }

# 向量计算
candle-core = "0.10.2"
candle-transformers = "0.10.2"
candle-nn = "0.10.2"

# Tokenizer
tokenizers = "0.22.2"

# HTTP 客户端（模型下载）
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }

# SHA256 校验
sha2 = "0.10.9"
hex = "0.4.3"

# CLI
clap = { version = "4.6.6", features = ["derive", "env"] }

# 数据目录
dirs = "6.0.0"
