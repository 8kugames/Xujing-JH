[package]
name = "cyber-jianghu-agent"
version = "0.1.422"
edition = "2024"
authors = ["Xujing-JH Community"]
license = "Apache-2.0"
description = "Agent SDK for Xujing-JH MMO-MAS - connects to game server with multiple decision modes"

[dependencies]
# 协议（包含合并后的 GameError)
cyber-jianghu-protocol = { version = "0.1.112", path = "../protocol" }

# 异步运行时
tokio = { workspace = true }
async-trait = "0.1.92"

# WebSocket 客户端
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9.34"

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# 工具库
chrono = { workspace = true }
uuid = { workspace = true }
url = "2.5.8"
percent-encoding = "2.3.2"
dirs = "6.0.0"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
lru = "0.12.5"

# HTTP 客户端（用于 Server HTTP API 调用）
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }

# HTTP 服务器（用于 HTTP API 辅助功能）
axum = { version = "0.8.9", features = ["ws", "tokio"] }
tower = "0.5.3"
http-body-util = "0.1.5"
http-body = "1.1.0"
bytes = "1.12.1"

# SSE 流式响应
async-stream = "0.3.6"
tower-http = { version = "0.6.11", features = ["cors", "fs"] }

# SQLite 数据库（用于本地记忆存储）
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }

# Embedding 服务（本地嵌入 + 远程调用）
cyber-jianghu-embedding = { workspace = true }

# HNSW 向量索引（用于向量检索）
instant-distance = "0.6.1"

# 并行计算
rayon = "1.12.0"

# 快速哈希（用于缓存变化检测）
fnv = "1.0.7"
hex = "0.4.3"
sha2 = "0.10.9"

# 随机数生成
rand = { workspace = true }

# 文件系统监控（配置热加载）
notify = "7.0.0"

# 浏览器打开
open = "5.4.3"

# 速率限制（HTTP API）
governor = "0.6.3"

# 安全内存清理（API密钥）
zeroize = "1.9.0"

# 决策模型：llama-server 运行时归档（tar.gz）解压
tar = "0.4.44"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# 决策模型：macOS 物理内存探测（低配自动降档判据）
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.175"

[dev-dependencies]
tokio-test = "0.4.5"
tempfile = "3.27.0"
dotenv = "0.15.0"
tracing-test = { workspace = true }
